[package]
name = "codypendent-knowledge"
description = "The knowledge fabric: governed registry, hybrid retrieval, memory, and the code graph. A library the daemon and runtime consume; it never depends on them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Bench targets are listed explicitly below; autodiscovery is off so a stray
# file under `benches/` cannot silently become a build target.
autobenches = false

# Depends only on the protocol (shared IDs + wire types) and external crates —
# never on the daemon or runtime, which depend on THIS crate. That inversion is
# what lets the registry/memory/graph live in one reusable place.

[dependencies]
codypendent-protocol = { workspace = true }
# The plugin/skill security boundary (Phase 6): skill `scripts/` execute through
# the sandbox executor under a profile derived from the skill's `[permissions]`.
# Acyclic — `codypendent-sandbox` depends on neither this crate nor the protocol.
codypendent-sandbox = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
tantivy = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-javascript = { workspace = true }
notify = { workspace = true }
# Collaborative-document CRDT (Phase 4, ADR-016) — authoritative for drafts.
loro = { workspace = true }
# The LanguageAdapter trait (Phase 4, Chapter 07) has async methods.
async-trait = { workspace = true }
# For `spawn_blocking` around the package walk/hash (sqlx already binds this
# crate to the tokio runtime; this only names it directly).
tokio = { workspace = true }
url = "2.5"

[dev-dependencies]
tantivy-sstable = "0.3"
tempfile = { workspace = true }
criterion = { workspace = true }
# Assembles the WebAssembly text fixture the end-to-end skill-module test runs.
# Test-only: the shipped binary never parses WebAssembly text.
wat = "1"

# The code-graph fold: the per-file preflight the repository scan runs once per
# candidate file. `harness = false` gives criterion `main` and is what keeps the
# target out of `cargo test` (verified with `--no-run`); `test = false` restates
# that intent explicitly. See crates/protocol/Cargo.toml.
[[bench]]
name = "codegraph"
harness = false
test = false

# The run path's knowledge-fabric leg: `emit_context` → `assemble_context`, and
# the uncached `repository_map` inside it, measured against a real migrated
# SQLite database at four graph sizes.
[[bench]]
name = "runpath"
harness = false
test = false

[lints]
workspace = true
