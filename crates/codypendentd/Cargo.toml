[package]
name = "codypendent-codypendentd"
description = "codypendentd assembly binary: wires the daemon server to the runtime agent loop via a RunExecutor (dependency inversion)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true

# Bench targets are listed explicitly below; autodiscovery is off so a stray
# file under `benches/` cannot silently become a build target.
autobenches = false

[[bin]]
name = "codypendentd"
path = "src/main.rs"

[lib]
name = "codypendent_codypendentd"
path = "src/lib.rs"

[dependencies]
codypendent-daemon = { workspace = true }
codypendent-runtime = { workspace = true }
# The provider catalog layered with the user's `providers.toml`, so a run
# authenticates against a user-defined provider the same way `models check`
# and the TUI do (`executor::load_model_registry`). A network-free leaf crate.
codypendent-providers = { workspace = true }
codypendent-sandbox = { workspace = true }
codypendent-protocol = { workspace = true }
codypendent-council = { workspace = true }
# The Phase-7 utility router (behind the default-OFF routing seam in
# `src/routing.rs`): `Router::route`/`escalate`, `TaskNode`, the security hard
# filter, and the classifier this assembly builds a `TaskNode` for.
codypendent-routing = { workspace = true }
codypendent-knowledge = { workspace = true }
codypendent-integrations = { workspace = true }
codypendent-workflow = { workspace = true }
codypendent-eval = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# Parses the `<data_dir>/routing.toml` registry item that enables the Phase-7
# routing seam (default OFF), the `models.toml` precedent.
toml = { workspace = true }
chrono = { workspace = true }
croner = { workspace = true }
chrono-tz = { workspace = true }
# uuid: per-run worktree lease ids (T5) + the docs-publish scratch-worktree
# directory name (Phase 4 STEP 4.4). thiserror: publish-path error types.
uuid = { workspace = true }
thiserror = { workspace = true }
rustix = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Encodes an opened memory-evidence artifact for the wire, the same way
# `PutArtifact` carries bytes: JSON framing has no byte-string scalar.
base64 = { workspace = true }

[dev-dependencies]
codypendent-control-plane = { workspace = true }
codypendent-control-plane-protocol = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
axum = "0.8"

# The run prelude: the two `git` subprocesses `spawn_run` pays before it decides
# whether there is any work to do. `harness = false` gives criterion `main` and
# is what keeps the target out of `cargo test`; `test = false` restates that
# intent explicitly.
[[bench]]
name = "runprelude"
harness = false
test = false

[lints]
workspace = true
