[package]
name = "codypendent-daemon"
description = "codypendentd: persistence, command handling, subscriptions, and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
# Bench targets are listed explicitly below; autodiscovery is off so a stray
# file under `benches/` cannot silently become a build target.
autobenches = false

# Lib-only: the `codypendentd` binary now lives in `crates/codypendentd` (the
# assembly layer that depends on BOTH this crate and `codypendent-runtime` and
# injects a `RunExecutor`). Keeping the daemon lib-only is what breaks the
# would-be dependency cycle (runtime depends on daemon).

[dependencies]
codypendent-protocol = { workspace = true }
codypendent-control-plane-protocol = { workspace = true }
codypendent-ui-host = { workspace = true }
codypendent-sandbox = { workspace = true }
# Milestone 5 marketplace verification. The reachable install/update path
# (`crate::marketplace`) must not re-implement signature, checksum and
# publisher-trust checks: `codypendent-marketplace` owns them (`PackageVerifier`,
# `TrustManager`) over `crates/sandbox/src/{manifest,verify}.rs`. It depends only
# on the sandbox, so naming it here adds no cycle.
codypendent-marketplace = { workspace = true }
codypendent-secrets = { workspace = true }
reqwest = { workspace = true }
# The Phase-7 routing engine's `ModelProfile` is the value this crate's
# `ModelProfileStore` (migration 0014) persists — the daemon owns the durable
# profile store the router reads. `codypendent-routing` is a leaf crate
# (protocol-only deps), so this adds no cycle.
codypendent-routing = { workspace = true }
# The governed memory ledger. `RememberMemory` (the composer's `#` quick-add) is
# documented as gated by the curator's secret and dedup filters, and that gate
# lives in `MemoryStore::curate`. `codypendent-knowledge` depends only on the
# protocol and the sandbox — never on this crate — so consuming it here is the
# intended direction, not a cycle.
codypendent-knowledge = { workspace = true }
# Milestone 6 federation: graph publication policy, the outbound shared-graph
# projection, tombstones, access-safe cross-repository traversal and the
# campaign coordinator. `codypendent-federation` depends only on the protocol
# and `codypendent-workflow` (both below this crate), so naming it here adds no
# cycle — unlike the code graph, whose scan lives in `codypendent-knowledge`'s
# assembly seam, the federation tables are plain SQL over this crate's own pool.
codypendent-federation = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
sqlx = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
croner = { workspace = true }
chrono-tz = { workspace = true }
# Robust home resolution for policy path expansion: `$HOME` with an OS
# fallback, so a stripped environment cannot silently drop `$HOME/...` DENY
# entries (they fail closed instead — see `policy::build_path_scope`).
directories = { workspace = true }
# Webhook-style HMAC is already a workspace dep (Phase 3); here it signs resume
# tokens (`server::mint_resume_token`) instead of the ad-hoc sha2 sandwich.
hmac = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
base64 = { workspace = true }
tempfile = { workspace = true }
async-trait = { workspace = true }
portable-pty = { workspace = true }
tokio-util = { workspace = true }
rand = { workspace = true }
ignore = { workspace = true }
nucleo-matcher = { workspace = true }

[dev-dependencies]
codypendent-test-support = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
axum = "0.8"

# The event-ledger write path and the search projection that rides with it.
# `harness = false` gives criterion `main` and is what keeps the target out of
# `cargo test` (verified with `--no-run`); `test = false` restates that intent
# explicitly. See crates/protocol/Cargo.toml.
[[bench]]
name = "ledger"
harness = false
test = false

[lints]
workspace = true
