# Build downloadable `codypendent` + `codypendentd` + hardened UI worker launcher for Linux and
# macOS, the Tauri desktop bundle, and the VS Code extension `.vsix`, then
# publish a GitHub Release. Three triggers:
#   - a version tag (`v1.2.3`)      → a normal release attached to that tag;
#   - every push to `main`          → a rolling prerelease `v<ver>-build.<run>`,
#                                     so every commit to main cuts + publishes a
#                                     release (as requested);
#   - manual "Run workflow"         → artifacts only.
#
# Windows is not built: the daemon speaks over a Unix domain socket
# (`UnixListener`) and uses Unix signals + process groups, so it does not
# compile on Windows without a named-pipe port. Apple Silicon and Linux builds
# are native; the Intel CLI is cross-compiled on the Apple Silicon runner.
name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      require_apple_signing:
        description: Require Developer ID signing and notarization (artifacts only; never publishes)
        type: boolean
        default: true

permissions:
  # Build, test, and packaging jobs are read-only. The publish job below is the
  # sole place that receives release-writing authority.
  contents: read

jobs:
  rust-lint:
    name: Rust lint gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text(encoding="utf-8"))
          print(manifest["workspace"]["package"]["version"])
          PY
          )"
          expected="v${version}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match workspace version '$expected'."
            exit 1
          fi
      - name: Check release workflow security invariants
        run: python3 .github/scripts/check_release_workflow_security.py
      - name: Check Apple release tooling
        run: |
          python3 apps/desktop/scripts/test_apple_release.py
          python3 apps/desktop/scripts/test_prepare_embedding_runtime.py
          python3 .github/scripts/tests/test_release_install.py
          bash -n install.sh apps/desktop/scripts/apple-signing-env.sh apps/desktop/scripts/sign-apple-release.sh apps/desktop/scripts/sign-apple-runtime.sh apps/desktop/scripts/package-apple-release.sh
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-lint
      - run: cargo fmt --all -- --check
      - name: Check migration immutability
        run: |
          python3 .github/scripts/check_migration_immutability.py
          python3 .github/scripts/check_release_versions.py
          python3 .github/scripts/check_migration_immutability.py --directory crates/control-plane/migrations
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: .github/scripts/check_generated_protocol.sh
      - run: .github/scripts/check_generated_control_plane_protocol.sh

  rust-test:
    name: Rust test gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: codypendent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codypendent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/codypendent_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}"
          sudo docker image prune -af || true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-test
      - name: Install runtime test dependencies
        # Pinned tarball, not apt — same install as ci.yml's `test` job and for
        # the same reason (see the comment there): an apt mirror stall here had
        # no timeout at all and would have burned hours on release day.
        timeout-minutes: 2
        run: |
          set -eu
          curl -fsSL --retry 3 --retry-connrefused -o /tmp/rg.tar.gz \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  /tmp/rg.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/rg.tar.gz -C /usr/local/bin --strip-components=1 \
            ripgrep-14.1.1-x86_64-unknown-linux-musl/rg
          rg --version
      - name: Build tests
        run: cargo test --workspace --all-features --no-run
      - name: Run tests
        timeout-minutes: 15
        run: cargo test --workspace --all-features

  supply-chain:
    name: dependency policy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check root Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          manifest-path: ./Cargo.toml
          arguments: --all-features --locked --config deny.toml
      - name: Check desktop Tauri license, ban, and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features --locked --config deny.toml
          # Reuse the root policy verbatim for these three checks. Desktop-only
          # advisory exceptions live in a separate, narrow config below.
          command-arguments: licenses bans sources
      - name: Check desktop Tauri advisory policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features --locked --config apps/desktop/src-tauri/deny.toml
          command-arguments: advisories

  desktop-tauri-quality:
    name: desktop Tauri quality gate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev build-essential patchelf file xvfb webkit2gtk-driver
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-desktop-tauri
          workspaces: apps/desktop/src-tauri
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.4"
      - name: Build frontend for the native shell check
        run: |
          npm --prefix sdk/protocol ci
          npm --prefix sdk/protocol run build
          npm --prefix sdk/ui ci
          npm --prefix sdk/ui run build
          npm --prefix apps/desktop ci
          npm --prefix apps/desktop run build
      - name: Prepare bundled native runtimes
        run: |
          python3 apps/desktop/scripts/prepare-monty-runtime.py
          python3 apps/desktop/scripts/prepare-embedding-runtime.py
      - name: Check the complete Tauri bridge and application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features app --all-targets --locked
      - name: Build native clients for desktop handoff
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          cargo build --locked -p codypendent-cli --bin codypendent -p codypendent-ui-worker-launcher --bin codypendent-ui-worker-launcher
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --features app,tauri/custom-protocol --bin codypendent-desktop
      - name: Native desktop disconnect and replay
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          CODYPENDENT_TEST_BINARY: ${{ github.workspace }}/target/debug/codypendent
          CODYPENDENT_DESKTOP_BINARY: ${{ github.workspace }}/apps/desktop/src-tauri/target/debug/codypendent-desktop
          CODYPENDENT_SMOKE_OUTPUT: ${{ github.workspace }}/work/desktop-smoke
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
          # Only the disposable WebKit fixture; daemon execution policy is unchanged.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: xvfb-run -a npm --prefix apps/desktop run test:native

      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - run: >-
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  frontend-quality:
    name: frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            sdk/protocol/package-lock.json
            sdk/ui/package-lock.json
            sdk/remote-ui/package-lock.json
            sdk/control-plane/package-lock.json
            sdk/control-plane-react/package-lock.json
            extensions/vscode/package-lock.json
            apps/desktop/package-lock.json
            apps/web/package-lock.json
      - name: Install and check generated protocol SDK
        working-directory: sdk/protocol
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Install and check UI SDK
        working-directory: sdk/ui
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Install and check Remote UI SDK
        working-directory: sdk/remote-ui
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Install and check VS Code client
        working-directory: extensions/vscode
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm run vscode:prepublish
          npm audit --audit-level=high
      # `vscode:prepublish` above stops one step short of an installable
      # artefact. A `.vsix` is platform-INDEPENDENT, so it is packaged once here
      # rather than per build-matrix target. `vsce package` re-runs
      # `vscode:prepublish` itself, so the bundle in the .vsix is the one this
      # job just proved. No secret is involved — packaging needs none; only
      # marketplace PUBLISHING would need VSCE_PAT, which this repo does not do.
      - name: Package the VS Code extension
        working-directory: extensions/vscode
        run: npm run package
      - name: Upload the extension bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codypendent-vsix
          path: extensions/vscode/*.vsix
          if-no-files-found: error
      - name: Install and check desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Install and check control-plane SDK
        working-directory: sdk/control-plane
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Install and check control-plane React bindings
        working-directory: sdk/control-plane-react
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Install and check control-plane web app
        working-directory: apps/web
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high

  build:
    name: build ${{ matrix.target }}
    needs: [desktop-tauri-quality, frontend-quality, rust-lint, rust-test, supply-chain]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            # macOS Intel runners (macos-13) are retired; cross-compile the
            # x86_64 binary on the Apple Silicon runner. The release job only
            # builds (never runs) the binary, so cross-compilation is safe.
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest # Apple Silicon runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Build release binaries
        run: >
          cargo build --release --locked
          --target ${{ matrix.target }}
          --bin codypendent --bin codypendentd --bin codypendent-ui-worker-launcher

      - name: Resolve the workspace version
        id: version
        shell: bash
        run: |
          # The single source of truth is [workspace.package] version in the root
          # Cargo.toml; every crate inherits it via `version.workspace = true`.
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage the CLI archive payload
        shell: bash
        run: |
          dist="codypendent-${{ matrix.target }}"
          mkdir -p "$dist"
          # The primary artifact is the single self-contained `codypendent`
          # binary (it runs the daemon from itself via `codypendent __daemon`).
          # It MUST be present.
          cp "target/${{ matrix.target }}/release/codypendent" "$dist/"
          # Mandatory pre-exec rlimit boundary for embedded TypeScript/React UI workers.
          cp "target/${{ matrix.target }}/release/codypendent-ui-worker-launcher" "$dist/"
          # `codypendentd` stays as an OPTIONAL standalone daemon for advanced
          # use; ship it if this build produced it, but never fail if absent.
          cp "target/${{ matrix.target }}/release/codypendentd" "$dist/" 2>/dev/null || true
          python3 apps/desktop/scripts/prepare-monty-runtime.py --target "${{ matrix.target }}" --output "$dist"
          python3 apps/desktop/scripts/prepare-embedding-runtime.py --target "${{ matrix.target }}" --output "$dist" --no-tauri
          # Remote UI executes only on a pinned, self-contained runtime tree.
          # Release binaries deliberately do not fall back to PATH/system Node.
          node_version="22.23.4"
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu)
              node_platform="linux-x64"
              node_sha256="b8492284c76a54baf58d61668dd0e41ee0fc98adabf9503d30f05d08f55b4406"
              ;;
            x86_64-apple-darwin)
              node_platform="darwin-x64"
              node_sha256="efcc2b0db6f94bf53eddb038fe2b370277a042bd29e4f19b8f8e23598795b819"
              ;;
            aarch64-apple-darwin)
              node_platform="darwin-arm64"
              node_sha256="c9e1dbc748b33ed2d14f42445191ecaf14c56259c7a9a26d0042c49ec2b66428"
              ;;
          esac
          node_archive="node-v${node_version}-${node_platform}.tar.gz"
          node_base="https://nodejs.org/dist/v${node_version}"
          curl --fail --silent --show-error --location --remote-name "$node_base/$node_archive"
          echo "$node_sha256  $node_archive" | shasum -a 256 -c -
          mkdir -p "$dist/node-runtime"
          tar -xzf "$node_archive" --strip-components=1 -C "$dist/node-runtime"
          mkdir -p "$dist/node-runtime/share/doc/codypendent"
          cp third_party/tantivy-sstable/LICENSE "$dist/node-runtime/share/doc/codypendent/TANTIVY_SSTABLE_LICENSE"
          python3 - "$dist/node-runtime" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          entries = []
          for path in sorted(root.rglob("*")):
              relative = path.relative_to(root).as_posix()
              if path.is_symlink():
                  entries.append({"kind": "link", "path": relative, "digest": os.readlink(path)})
              elif path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  entries.append({"kind": "file", "path": relative, "digest": digest})
          (root / ".codypendent-runtime-seal.json").write_text(
              json.dumps(entries, separators=(",", ":")), encoding="utf-8"
          )
          PY
          cp README.md ROADMAP.md "$dist/" 2>/dev/null || true

      - name: Sign and notarize macOS CLI payload
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          REQUIRE_APPLE_SIGNING: ${{ inputs.require_apple_signing || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            bash apps/desktop/scripts/sign-apple-runtime.sh "codypendent-${{ matrix.target }}"
            echo "CLI ${{ matrix.target }}: every executable Developer ID signed and notarization verified." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REQUIRE_APPLE_SIGNING" = "true" ]; then
            echo "::error::Apple CLI signing was required but APPLE_CERTIFICATE is not configured."
            exit 1
          else
            echo "::warning::CLI ${{ matrix.target }} is an unsigned preview, not a production Apple release."
            echo "CLI ${{ matrix.target }}: **UNSIGNED preview**." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package the tarball
        id: package
        shell: bash
        run: |
          set -euo pipefail
          dist="codypendent-${{ matrix.target }}"
          tar -czf "$dist.tar.gz" "$dist"
          echo "artifact=$dist.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload the build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codypendent-${{ matrix.target }}
          path: ${{ steps.package.outputs.artifact }}
          if-no-files-found: error

  # The desktop app's ENTIRE Rust side lives in `apps/desktop/src-tauri`, which
  # is its own workspace root (see the rationale comment in its Cargo.toml), so
  # neither `cargo build --workspace` above nor `cargo check --workspace` in
  # `ci` ever compiles it. This job is the only thing in the repository that
  # produces an installable desktop artefact.
  #
  # macOS is staged with the matching CLI, worker launcher and sealed Node
  # runtime, then signed inside-out and notarized when Apple credentials exist.
  # Unsigned builds remain clearly labelled preview archives.
  desktop-bundle:
    name: desktop bundle ${{ matrix.target }}
    needs: [build, desktop-tauri-quality, frontend-quality, rust-lint, rust-test, supply-chain]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            bundles: app
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bundles: appimage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # src-tauri depends on ../../../crates/protocol and ../../../crates/council
      # by path, so this needs the full checkout, not just apps/desktop.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: |
            sdk/protocol/package-lock.json
            sdk/ui/package-lock.json
            apps/desktop/package-lock.json

      - name: Install the Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      # Derived from apps/desktop/src-tauri/Cargo.lock: gtk 0.18, webkit2gtk-sys
      # 2.0 (→ webkit2gtk-4.1), soup3, javascriptcore-rs 1.1, libappindicator
      # 0.9. Without these the `wry`/`webkit2gtk-sys` build scripts fail at
      # pkg-config time, which is exactly why this crate is not a workspace
      # member. `patchelf` + `file` + `wget` are what the AppImage step needs;
      # it also downloads `linuxdeploy` at bundle time, so the job needs egress.
      - name: Install the Tauri Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev build-essential patchelf file wget

      - name: Resolve the workspace version
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # tauri.conf.json's `version` is what stamps CFBundleShortVersionString
      # and the Linux package version. It is a separate workspace, so it cannot
      # inherit [workspace.package] version — stamp it here instead, or a bundle
      # attached to a v0.11.0 release announces itself as whatever that file
      # last said.
      - name: Stamp the workspace version into the bundle
        shell: bash
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json, sys, pathlib
          path = pathlib.Path("apps/desktop/src-tauri/tauri.conf.json")
          config = json.loads(path.read_text())
          config["version"] = sys.argv[1]
          path.write_text(json.dumps(config, indent=2) + "\n")
          PY
          grep -m1 '"version"' apps/desktop/src-tauri/tauri.conf.json

      # apps/desktop consumes both SDKs through `file:` links, and npm links a
      # folder without building it — same ordering the `frontend-quality` job
      # and ci.yml's `sdk-desktop` job already use.
      - name: Prepare the local SDK dependencies
        run: |
          (cd sdk/protocol && npm ci && npm run build)
          (cd sdk/ui && npm ci && npm run build)

      - name: Download the matching Apple runtime
        if: runner.os == 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: codypendent-${{ matrix.target }}
          path: apple-runtime

      - name: Build the desktop bundle
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          npm ci
          # Stage the complete runtime before applying any distribution signature.
          npm run tauri:build -- --bundles ${{ matrix.bundles }} --no-sign

      - name: Stage the self-contained Apple runtime
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "apple-runtime/codypendent-${{ matrix.target }}.tar.gz" -C apple-runtime
          python3 apps/desktop/scripts/apple-release.py stage \
            apps/desktop/src-tauri/target/release/bundle/macos/Codypendent.app \
            "apple-runtime/codypendent-${{ matrix.target }}"
          python3 apps/desktop/scripts/apple-release.py verify \
            apps/desktop/src-tauri/target/release/bundle/macos/Codypendent.app

      - name: Sign and notarize the complete Apple app
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          REQUIRE_APPLE_SIGNING: ${{ inputs.require_apple_signing || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            bash apps/desktop/scripts/sign-apple-release.sh \
              apps/desktop/src-tauri/target/release/bundle/macos/Codypendent.app \
              "codypendent-desktop-${{ matrix.target }}.dmg"
            echo "macOS: Developer ID signatures, hardened runtime, stapled notarization and Gatekeeper verified." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$REQUIRE_APPLE_SIGNING" = "true" ]; then
            echo "::error::Apple signing was required but APPLE_CERTIFICATE is not configured."
            exit 1
          else
            echo "::warning::Building an unsigned Apple preview; this is not a notarized public release."
            echo "macOS: self-contained **UNSIGNED preview**, not a notarized Apple release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package the desktop artefact
        id: package
        shell: bash
        run: |
          set -euo pipefail
          bundle="apps/desktop/src-tauri/target/release/bundle"
          case "${{ matrix.bundles }}" in
            app)
              test -d "$bundle/macos/Codypendent.app"
              if [ ! -f "codypendent-desktop-${{ matrix.target }}.dmg" ]; then
                bash apps/desktop/scripts/package-apple-release.sh \
                  "$bundle/macos/Codypendent.app" "codypendent-desktop-${{ matrix.target }}.dmg"
              fi
              tar -czf "codypendent-desktop-${{ matrix.target }}.tar.gz" \
                -C "$bundle/macos" "Codypendent.app"
              echo "artifact=codypendent-desktop-${{ matrix.target }}.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
            appimage)
              image="$(find "$bundle/appimage" -maxdepth 1 -type f -name '*.AppImage' | head -n 1)"
              test -n "$image"
              cp "$image" "codypendent-desktop-${{ matrix.target }}.AppImage"
              chmod 0755 "codypendent-desktop-${{ matrix.target }}.AppImage"
              echo "artifact=codypendent-desktop-${{ matrix.target }}.AppImage" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Upload the desktop artefact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: codypendent-desktop-${{ matrix.target }}
          path: codypendent-desktop-${{ matrix.target }}.*
          if-no-files-found: error

  release-artifacts:
    name: verify release artifacts
    needs: [build, desktop-bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Collect every platform archive before touching the release. Publishing
      # from the matrix jobs races concurrent release-policy/asset updates and
      # can leave a partially populated release even though every build passed.
      - name: Download platform archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: codypendent-*
          path: dist
          merge-multiple: true

      - name: Resolve the workspace version
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Every artefact the release advertises must be here BEFORE anything is
      # published, and nothing unaccounted-for may ride along. The desktop
      # bundle is deliberately narrower than the CLI: no Intel-macOS desktop
      # bundle is built, so `codypendent install desktop` refuses there rather
      # than installing an Apple-Silicon `.app` that cannot launch.
      - name: Verify the complete release set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            codypendent-x86_64-unknown-linux-gnu.tar.gz
            codypendent-x86_64-apple-darwin.tar.gz
            codypendent-aarch64-apple-darwin.tar.gz
            codypendent-desktop-aarch64-apple-darwin.tar.gz
            codypendent-desktop-aarch64-apple-darwin.dmg
            codypendent-desktop-x86_64-unknown-linux-gnu.AppImage
          )
          for archive in "${expected[@]}"; do
            test -s "dist/$archive"
          done
          # Counted per extension so a new artefact cannot slip in unnamed, and
          # so a missing one names its own kind. The .vsix carries the
          # extension's own version (independent of the workspace version), so
          # it is counted rather than named.
          count() { find dist -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' '; }
          test "$(count '*.tar.gz')" = "4"
          test "$(count '*.dmg')" = "1"
          test "$(count '*.AppImage')" = "1"
          test "$(count '*.vsix')" = "1"

      - name: Hash the final distribution assets
        run: python3 .github/scripts/generate_release_manifest.py dist

      - name: Upload verified distribution set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [release-artifacts]
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-artifacts
          path: dist
      - name: Resolve the workspace version
        id: version
        shell: bash
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.vsix
            dist/*.dmg
            dist/SHA256SUMS

      # Every push to main cuts one fresh, per-commit prerelease after every
      # platform artifact has passed the same quality gates.
      - name: Publish rolling release (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: codypendent v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: docs/releases/v${{ steps.version.outputs.version }}.md
          files: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.vsix
            dist/*.dmg
            dist/SHA256SUMS
