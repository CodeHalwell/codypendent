name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # CI never debugs these builds, so drop debug info and incremental state to
  # shrink `target/` and lower link-time memory on the heavy tree (tantivy,
  # tree-sitter, sqlx, both agent providers).
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  # `lint` and `test` are SEPARATE jobs on purpose. In one combined job the
  # runner kept a single `target/` holding both clippy's and test's artifacts
  # for the heavy tree, and the second compile overran the disk ~45 min into the
  # Test step. Splitting gives the test job a fresh runner with the full freed
  # disk, and — because CI logs are not retrievable here — the two-step
  # Build/Run split below makes the failing PHASE visible from step timing alone
  # (a build-phase death is compile/disk; a run-phase timeout is a hung test).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}"
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: lint
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check migration immutability
        run: |
          python3 .github/scripts/check_migration_immutability.py
          python3 .github/scripts/check_migration_immutability.py --directory crates/control-plane/migrations
      - name: Check release workflow security invariants
        run: python3 .github/scripts/check_release_workflow_security.py
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  generated-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: generated-protocol
      - name: Check generated protocol schemas
        run: .github/scripts/check_generated_protocol.sh
      # Same determinism + staleness double-export check for the control-plane protocol.
      # Without it `sdk/control-plane/schema/` can drift from the Rust types silently, and
      # the TypeScript gate in the `control-plane-web` job would then be checking generated
      # output against a stale schema — green, and wrong.
      - name: Check generated control plane schemas
        run: .github/scripts/check_generated_control_plane_protocol.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: codypendent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codypendent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/codypendent_test
    # The workspace sweep runs in well under 15 minutes; anything past 40 is a
    # stall, not slow tests. Without this the job inherits a 6-hour default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}"
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test
      - name: Install ripgrep
        # The workspace.search tool shells out to `rg` (Phase 1 STEP 1.7); its
        # integration test needs ripgrep on PATH, which ubuntu-latest lacks.
        #
        # NOT `apt-get install ripgrep`, deliberately. The apt route first hung
        # here for 70 minutes on a mirror that never answered; bounding it to 5
        # minutes then converted the next mirror stall into a red main (run
        # 32271355953, 2026-08-19 — apt ate the whole bound and the suite never
        # ran). A pinned release tarball has no mirror weather to inherit,
        # installs in ~2s, and the pinned digest is a stronger supply-chain
        # stance than an unpinned apt package. Bump version and digest
        # together; the digest is over the published x86_64-musl tarball.
        timeout-minutes: 2
        run: |
          set -eu
          curl -fsSL --retry 3 --retry-connrefused -o /tmp/rg.tar.gz \
            https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz
          echo "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e  /tmp/rg.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/rg.tar.gz -C /usr/local/bin --strip-components=1 \
            ripgrep-14.1.1-x86_64-unknown-linux-musl/rg
          rg --version
      # NOT `cargo nextest run`, and that is deliberate rather than an oversight
      # — read this before "modernising" the runner again.
      #
      # Two reasons, both checkable from this repository rather than from a
      # benchmark:
      #
      # 1. nextest does not run doctests. Swapping the runner without also adding
      #    a `cargo test --workspace --all-features --doc` step would silently
      #    drop that coverage. There are zero doctests in the tree today (all 26
      #    rustdoc fences are tagged text/toml/ignore), so the gap would not show
      #    up as a failure — it would show up as the first doctest anyone writes
      #    never being executed.
      #
      # 2. There is a real order race in the suite that a global one-process-
      #    per-test scheduler is more likely to expose than `cargo test`'s
      #    binary-at-a-time run. `codypendentd::council_lifecycle_it::
      #    successful_council_closes_real_member_and_chair_sessions_after_
      #    terminal_evidence` polls the sessions table until two child sessions
      #    read `closed`, then asserts each already has a `RunCompleted` event in
      #    the ledger and that `completed.sequence < closed[0].sequence`
      #    (crates/codypendentd/tests/council_lifecycle_it.rs:631). Those are two
      #    separate writes and the poll loop waits for the state flip, not for
      #    the terminal event, so the assert can land in the gap. That is a bug
      #    in the test regardless of runner; raising concurrency just raises the
      #    odds. Fix it — wait for the terminal event, not the state flip —
      #    before changing how the suite is scheduled.
      #
      # NO SPEED COMPARISON IS RECORDED HERE, and the one that used to be is
      # gone. It asserted 2.6x-3.5x for nextest over `cargo test` with per-run
      # wall clocks and a 2-in-6 nextest flake rate, and none of it was
      # reproducible: cargo-nextest has never been installed on the machine those
      # figures were attributed to (`cargo nextest --version` there reports "no
      # such command"). The mechanism the table described is plausible — this
      # workspace builds 99 test binaries and `cargo test` runs them one after
      # another, each with its own thread pool, so every binary's tail leaves
      # cores idle — but plausible is not measured, and an invented number is a
      # worse basis for a runner swap than no number at all.
      #
      # If the swap is ever made, it is: install nextest
      #   (`cargo install cargo-nextest --locked`, or
      #    curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin")
      # then `cargo nextest run --workspace --all-features --no-run` here,
      # `cargo nextest run --workspace --all-features --no-fail-fast` below, plus
      # the `--doc` step from reason 1 — and post a real before/after from a CI
      # run, not from a laptop.
      #
      # `cargo nt` / `cargo ntw` exist in .cargo/config.toml as LOCAL aliases.
      # They are inert unless nextest is installed, and they are not what gates.
      - name: Build tests
        # Compile every test binary WITHOUT running, so a compile/disk failure is
        # isolated to this step (distinct from a test hang in the next one).
        run: |
          cargo test --workspace --all-features --no-run
          df -h /
      - name: Run tests
        # Bounded so a test that hangs only under CI fails fast and legibly (as a
        # timeout) instead of running to the 6 h job limit. The whole suite runs
        # in well under a minute locally.
        timeout-minutes: 15
        run: cargo test --workspace --all-features

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-macos
      # Compiling the whole workspace's TESTS on macOS, which nothing did
      # before: the full-workspace `test` job runs on ubuntu, and the step below
      # builds one crate. A test fixture using a Linux-only API — rustix's
      # `mknodat`, which has no macOS equivalent in that crate — therefore broke
      # `cargo test --workspace` on macOS while all thirteen checks stayed
      # green. `check` rather than `test` keeps this cheap: the failure mode it
      # exists to catch is a compile error, and the behaviour is already covered
      # on Linux.
      - name: Compile the workspace tests on macOS
        timeout-minutes: 25
        run: cargo check --workspace --all-features --all-targets

      - name: Run macOS sandbox tests
        timeout-minutes: 15
        run: cargo test -p codypendent-sandbox --all-features

  # The desktop app's Rust side (`apps/desktop/src-tauri`) is its OWN workspace
  # root — deliberately, because linking wry/webkit needs system libraries the
  # other Linux jobs do not install — which means `cargo check --workspace`,
  # `cargo clippy --workspace` and `cargo test --workspace` above never see a
  # single line of it. Until this job existed, nothing in the repository
  # compiled it at all: a broken bridge would have shipped green.
  #
  # It runs on Linux because that is the fragile half (macOS's WKWebView needs
  # no system packages), so this job is also the standing proof that the Linux
  # half of release.yml's `desktop-bundle` can still build.
  desktop-tauri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Derived from apps/desktop/src-tauri/Cargo.lock: gtk 0.18, webkit2gtk-sys
      # 2.0 (→ webkit2gtk-4.1), soup3, javascriptcore-rs 1.1, libappindicator
      # 0.9. Their build scripts fail at pkg-config time without these.
      - name: Install the Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libgtk-3-dev \
            libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libxdo-dev build-essential patchelf file
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: desktop-tauri
          workspaces: apps/desktop/src-tauri
      # Default features only, NOT --all-features: the `app` feature gates the
      # binary because `tauri::generate_context!` embeds `apps/desktop/dist` at
      # compile time, so enabling it here would require a full frontend build
      # for no extra coverage of the transport, which is the part with logic.
      # `cargo fmt --all` in the `lint` job runs on the ROOT workspace, and this
      # is a separate one, so it is not reached from there — unformatted code
      # accumulated here unnoticed until someone ran fmt by hand.
      - name: Format
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --all -- --check
      - name: Check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets
      - name: Lint
        run: >
          cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml
          --all-targets -- -D warnings
      - name: Test
        timeout-minutes: 15
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Phase 7 STEP 7.1 eval-harness smoke: already covered by `test`'s
  # workspace-wide sweep, but broken out as its own job (like `deny`) so the
  # harness + shipped corpus have a distinct, fast, clearly-labelled signal —
  # "is `codypendent eval run`'s own machinery still correct" separate from
  # the rest of the workspace. `corpus_it.rs` validates the REAL
  # `evals/tasks/core/` suite shipped in this repo (parses, task classes and
  # the mandated assertion kinds present, one pinned revision); `eval_it.rs`
  # drives the exact runner code path against a deterministic, hand-rolled
  # mock daemon (no live model, no `codypendentd` subprocess) plus a real
  # throwaway git repo + `cargo test`, proving a known-pass case passes and a
  # known-fail case fails end to end. See `evals/README.md`.
  eval-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: eval-smoke
      - name: Eval harness + shipped corpus
        run: cargo test -p codypendent-eval --all-features
      - name: Eval runner smoke (mock daemon, known-pass/known-fail)
        run: cargo test -p codypendent-cli --all-features --test eval_it

  # THE regression gate `eval-smoke` (above) does not provide: `eval-smoke`
  # proves the harness's OWN code is correct in isolation; it never actually
  # runs `codypendent eval run` against the shipped `evals/tasks/core/`
  # corpus, so a case file edited into vacuity, an assertion that silently
  # stopped firing, or a scoring-logic regression — exactly the "harness
  # scored 3/12 PASS on a run where the agent never executed" class of bug
  # this outcome exists to fix — would pass `eval-smoke` cleanly. This job
  # runs the REAL corpus for real, against a deterministic, hand-scripted
  # stub model (`evals/ci/stub_model.py` — no API key, no live model, ever)
  # and fails if the result differs from the stored baseline
  # (`evals/baselines/core.json`) IN ANY DIRECTION: a lower score, a higher
  # score, a case that flipped either way, a case id added or removed, a
  # different corpus size. A drop-only gate could not catch the two failures
  # it exists for — a case edited into vacuity and an assertion that stopped
  # firing both RAISE the score, and a reviewer really did delete 10 of 13
  # cases and watch this job print `1.0000 (3/3) … PASSED`.
  #
  # WHAT IT DOES NOT DO, stated here because the roadmap sentence for this
  # outcome ("a skill or prompt edit that lowers the score fails CI") is NOT
  # true of this job and cannot be made true by a stub: the stub reads neither
  # a prompt file nor a skill file — it matches a literal substring of the
  # case's own prompt and replays a precomputed answer — so editing either
  # cannot move this score in either direction. Measuring prompt/skill quality
  # needs a live model: nondeterministic, paid, and deliberately out of CI's
  # reach. See `evals/ci/compare_baseline.py`'s module doc and
  # `evals/README.md`'s "What this gate can and cannot detect", which is the
  # claim of record.
  eval-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift \
            /usr/local/lib/node_modules "${AGENT_TOOLSDIRECTORY:-}"
          sudo docker image prune -af || true
          df -h /
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: eval-regression
      - name: Build codypendent-cli
        # A separate step (like `test`'s Build/Run split) so a compile
        # failure and a scored regression are distinguishable from CI log
        # timing alone.
        run: cargo build -p codypendent-cli
      - name: Eval corpus regression gate (deterministic stub model)
        run: evals/ci/run_gate.sh

  # Docs-drift gate: every `<!-- doc-count:… -->` marker in the shipped docs
  # must still match a real count over its named sources — see `.github/scripts/
  # check_doc_test_counts.py`'s own module doc for the full rationale and its
  # one deliberate limitation (static counting, not `cargo test --list`, so this
  # job needs no build and runs on every PR). This is the actual fix for "a
  # number in the docs was accurate the day it was written and nobody
  # re-derived it since" — the failure mode a 2026-08 docs-accuracy review found
  # across eight numbers in ROADMAP.md, and then found AGAIN, one release later,
  # in the numbers standing right next to the gated ones (vitest counts, catalog
  # rows, and the prose sentence one line above a correct marker). The marker
  # kinds now cover all three: `test` (Rust attributes), `match` (any regex —
  # catalog rows, workspace members), `vitest` (a real vitest run, below), plus
  # a prose check on every marker.
  # Pure Python + git, no toolchain, no build — as fast and cheap as `deny`.
  # `--skip-vitest` defers the two markers that need Node to the `extension`
  # job, printing exactly which ones rather than skipping silently.
  doc-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Doc count markers still match reality
        run: python3 .github/scripts/check_doc_test_counts.py --skip-vitest
      - name: docs/MANIFEST.json still matches docs/ on disk
        # Same class as the counts: a hand-maintained index with no generator
        # and no gate. It was 57 listed / 130 on disk at one review, was
        # regenerated by hand, and had missed the two newest release notes
        # again within the same release cycle.
        run: python3 .github/scripts/check_docs_manifest.py

  # Supply-chain gate (every-release hygiene): advisories, licenses, bans, and
  # sources per `deny.toml`. A separate lightweight job — it needs no build, only
  # the lockfile and the RustSec advisory database the action fetches. Its dated
  # advisory exceptions live in `deny.toml` and the desktop's narrow advisory
  # config; licenses, bans, and sources always use the root policy.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # `cargo-deny-action` runs inside an Alpine/musl container whose ONLY
      # installed toolchain is `1.85.0-x86_64-unknown-linux-musl`. Rustup there
      # reads this repository's `rust-toolchain.toml` (`channel = "stable"`),
      # cannot resolve `stable-x86_64-unknown-linux-musl`, and aborts before
      # cargo-deny runs at all. `RUSTUP_TOOLCHAIN` takes precedence over a
      # toolchain file, so this points the container at what it actually has.
      #
      # Deliberately NOT fixed by pinning `rust-toolchain.toml`: the workspace
      # declares `rust-version = "1.95"`, so pinning the repo to the container's
      # 1.85.0 would fail every job that actually compiles. cargo-deny only reads
      # the manifest and lockfile — it never builds — so an older cargo is fine
      # for it and for nothing else.
      - name: Check root Rust dependency policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          manifest-path: ./Cargo.toml
          arguments: --all-features --locked --config deny.toml
      - name: Check desktop Tauri license, ban, and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features --locked --config deny.toml
          # Reuse the root policy rather than maintaining a weaker desktop copy.
          command-arguments: licenses bans sources
      - name: Check desktop Tauri advisory policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        env:
          RUSTUP_TOOLCHAIN: "1.85.0"
        with:
          command: check
          manifest-path: apps/desktop/src-tauri/Cargo.toml
          arguments: --all-features --locked --config apps/desktop/src-tauri/deny.toml
          command-arguments: advisories

  # VS Code extension (extensions/vscode): install, typecheck, lint, and the
  # vitest suite. A separate job on its own Node toolchain — a failure here
  # must never be entangled with the Rust jobs' disk/cache usage above, and
  # this suite runs in well under a minute either way.
  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # No .nvmrc/engines.node exists yet; 22 matches the extension's own
          # @types/node ^22.5.0.
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            sdk/protocol/package-lock.json
            sdk/ui/package-lock.json
            extensions/vscode/package-lock.json
      - name: Install UI SDK dependencies
        working-directory: sdk/ui
        run: npm ci
      - name: Check UI SDK
        working-directory: sdk/ui
        run: npm run check
      - name: Audit UI SDK dependencies
        working-directory: sdk/ui
        run: npm audit --audit-level=high
      # The extension depends on `@codypendent/protocol` through a `file:` link
      # and resolves its types via that package's `dist/`. npm links the folder
      # without building it, so without this step `dist/` does not exist and the
      # typecheck below fails on a clean checkout even though it passes locally.
      - name: Build protocol SDK local dependency
        working-directory: sdk/protocol
        run: |
          npm ci
          npm run build
      - name: Install extension dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        # Two reporters: the default one keeps the log readable, the JSON one
        # is what the doc-count markers below are settled against — same run,
        # so the number in the docs is the number that just passed.
        run: npx vitest run --reporter=default --reporter=json --outputFile=../../vitest-extension.json
      - name: Doc count markers that need a real vitest run
        # The counts a regex CANNOT get right: this suite declares 105
        # `it(`/`test(` blocks and vitest reports 217 tests, because `.each`
        # tables expand at run time. `doc-counts` (no Node) defers these two
        # markers; this is the job that settles them, on the same run that just
        # went green.
        working-directory: .
        run: |
          python3 .github/scripts/check_doc_test_counts.py \
            --vitest-report extensions/vscode=vitest-extension.json
      - name: Build development bundle
        run: npm run build
      - name: Build production bundle
        run: npm run vscode:prepublish
      # The release attaches a `.vsix`; packaging it is the step that actually
      # exercises the metadata `vsce` refuses without (LICENSE, `repository`)
      # and the .vscodeignore. Gating it here means a packaging break surfaces
      # on the PR that caused it rather than on release day. The `.vsix` is not
      # uploaded from `ci` — release.yml packages the one that ships.
      - name: Package the .vsix (release-packaging gate)
        run: npm run package
      - name: Audit extension dependencies
        run: npm audit --audit-level=high

  # Release-facing TypeScript surfaces not owned by the extension job above:
  # protocol bindings, the Remote UI authoring SDK, and the desktop frontend.
  # Build sdk/ui first because remote-ui and desktop consume it through a local
  # file dependency and a clean checkout has no committed dist/ tree.
  sdk-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            sdk/protocol/package-lock.json
            sdk/ui/package-lock.json
            sdk/remote-ui/package-lock.json
            apps/desktop/package-lock.json
      - name: Prepare UI SDK local dependency
        working-directory: sdk/ui
        run: |
          npm ci
          npm run build
      - name: Check generated protocol SDK
        working-directory: sdk/protocol
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Check Remote UI SDK
        working-directory: sdk/remote-ui
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Check desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run check
          npm test
          npm run build
          npm audit --audit-level=high

  # The control-plane packages and the control-plane web app landed with the
  # M7 work and had no CI coverage at all, so nothing would have caught them
  # rotting. They are independent of the daemon socket, so they gate on their
  # own job rather than lengthening `sdk-desktop`.
  control-plane-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22.13.1"
          cache: npm
          cache-dependency-path: |
            sdk/control-plane/package-lock.json
            sdk/control-plane-react/package-lock.json
            apps/web/package-lock.json
            sdk/ui/package-lock.json
      # `apps/web` depends on `sdk/ui` through a `file:` link, and `sdk/ui` has a
      # `prepare` script that runs its build. npm does NOT install a file:
      # dependency's devDependencies, so that build cannot resolve React's types
      # unless sdk/ui is installed and built first — the same ordering the
      # `extension` and `sdk-desktop` jobs already use.
      - name: Prepare UI SDK local dependency
        working-directory: sdk/ui
        run: |
          npm ci
          npm run build
      - name: Check control-plane SDK
        working-directory: sdk/control-plane
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Check control-plane React bindings
        working-directory: sdk/control-plane-react
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high
      - name: Check control-plane web app
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
