[package]
name = "codypendent-desktop"
description = "Tauri shell for the Codypendent desktop client: owns the codypendentd socket connection and bridges it to the webview."
version = "0.14.0"
edition = "2021"
rust-version = "1.95"
repository = "https://github.com/CodeHalwell/codypendent"
license = "MIT"
publish = false

# Deliberately its own workspace root, NOT a member of the repository
# workspace. The Tauri shell links wry/webkit, which needs system libraries the
# repository's Linux CI images do not install; folding it into the root
# workspace would make every `cargo check --workspace` on Linux fail on a
# missing `webkit2gtk` pkg-config entry. The daemon transport it wraps is the
# shared `codypendent-protocol` / `codypendent-council` code by path, so there
# is still exactly one wire codec (adoption 14 §6 acceptance criterion 2).
[workspace]

[lib]
name = "codypendent_desktop"
path = "src/lib.rs"

# The binary is behind the `app` feature because `tauri::generate_context!`
# embeds `frontendDist` at compile time and therefore requires `npm run build`
# to have produced `apps/desktop/dist` first. Gating it keeps `cargo
# fmt`/`clippy`/`test` on this crate runnable with no Node build in the loop —
# they cover the transport, which is the part with logic. Package with
# `npm run tauri:build` (or `cargo tauri dev -f app`), which builds the
# frontend first.
[[bin]]
name = "codypendent-desktop"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
app = []

[dependencies]
codypendent-protocol = { path = "../../../crates/protocol" }
codypendent-council = { path = "../../../crates/council" }
# LOCAL CONFIG, not protocol. `models.toml`, `providers.toml` and `auth.json`
# live as FILES under the runtime data dir; there is no wire command that reads
# or writes them, so the shell must open them itself. These two paths are a
# DELIBERATE manifest change, made so the desktop reuses the exact parsers and
# the exact secret-handling the CLI/TUI use instead of growing a second,
# drifting reader of the same files:
#
# * `codypendent-providers` is a network-free leaf crate (serde/toml/thiserror/
#   async-trait/tokio-sync) and is the only home of the curated provider
#   catalog. Near-free.
# * `codypendent-runtime` is the only home of `AuthStore` (`auth.json`, the
#   redacting-Debug secret store) and `ModelConfig`/`load_models`
#   (`models.toml`). It is NOT free — it pulls `codypendent-daemon`,
#   `codypendent-knowledge` and `codypendent-integrations` transitively — but a
#   hand-rolled second copy of the auth.json shape is a correctness and secret-
#   handling risk, not a build-time one: the desktop and the TUI must agree
#   byte-for-byte about the same file. `default-features = false` drops the
#   `agent-framework-anthropic` transport; `provider-openai` stays on because
#   it gates `ModelRegistry::check_model` / `credentials_resolvable`, which the
#   shell now runs for the Models page's readiness badges and its Test button
#   (`models.rs::model_readiness`) — the same probe the TUI's picker and
#   `codypendent models check` run. The shell still never drives a model; the
#   daemon runs them.
codypendent-providers = { path = "../../../crates/providers" }
codypendent-runtime = { path = "../../../crates/runtime", default-features = false, features = ["provider-openai"] }
# The knowledge surfaces (Skills, Memory, Docs) read the daemon's SQLite
# database directly, exactly as the TUI harness does — there is no wire
# command that lists registry items, memories, learnings or documents. This
# crate is already in the build transitively (through `codypendent-runtime`);
# naming it makes the stores and the shared card mapping importable
# (`knowledge.rs`). `sqlx` is named only for the `SqlitePool` type the
# stores take; the version and features unify with the workspace's.
codypendent-knowledge = { path = "../../../crates/knowledge" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
anyhow = "1.0"
# Artifact chunks cross the wire base64-encoded and content-addressed, so the
# shell decodes and re-verifies them exactly as the reference client does
# (`sdk/protocol/src/client.ts::readArtifact`) before handing bytes to a webview.
base64 = "0.23"
# The `models.toml` writers, ported from `crates/cli/src/models_file.rs` and
# `crates/cli/src/tui.rs::write_remove_model`: `fs4` for the advisory lock that
# serializes CLI/TUI/desktop edits of the shared file, `toml` for serializing
# the `[[model]]` array itself (the `ModelConfig` field set), and `toml_edit`
# for both write paths' comment- and formatting-preserving document edit.
fs4 = "0.8"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2", features = [] }
toml = "0.8"
toml_edit = "0.22"
# NATIVE FOLDER PICKER for repository selection. Called from Rust
# (`repository.rs`), never exposed to the webview as a capability: the webview
# asks the shell to open a picker and receives back a validated checkout path,
# so it can neither enumerate the filesystem nor name a directory the shell did
# not gate. `capabilities/default.json` therefore grants no `dialog:*`
# permission at all.
tauri-plugin-dialog = "2"
# OS notifications for work that BLOCKS A HUMAN (approvals, questions). The
# webview calls it through `@tauri-apps/plugin-notification`; the permission is
# declared in `capabilities/default.json`. Nothing else in the app notifies.
tauri-plugin-notification = "2"
# `time`: the daemon launcher polls the socket after spawning (`launcher.rs`).
tokio = { version = "1.40", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
chrono = "0.4"
tempfile = "3"
