[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/codypendentd",
    "crates/cli",
    "crates/council",
    "crates/tui",
    "crates/runtime",
    "crates/knowledge",
    "crates/integrations",
    "crates/workflow",
    "crates/sandbox",
    "crates/routing",
    "crates/providers",
    "crates/eval",
    "crates/test-support",
    "crates/ui-host",
    "crates/ui-worker-launcher",
    "crates/tui-e2e",
    "crates/runner",
    "crates/secrets",
    "crates/marketplace",
    "crates/control-plane",
    "crates/control-plane-protocol",
    "crates/federation",
    "sdk/wasm",
]
# The CRDT selection benchmark (Phase 4, STEP 4.1) is its own standalone
# workspace so Automerge/Yrs — pulled in only for the comparison — never enter
# the product's dependency graph. Excluded here so a root `cargo` command never
# tries to fold it into this workspace.
exclude = ["benches/crdt-bench"]

[workspace.package]
version = "0.14.0"
edition = "2021"
# 1.88 is the effective MSRV: the `agent-client-protocol` dep (ACP client) is
# edition-2024 / requires Rust 1.88. The pinned toolchain (rust-toolchain.toml)
# is newer, so builds are unaffected; this keeps the declared MSRV honest.
rust-version = "1.88"
repository = "https://github.com/CodeHalwell/codypendent"
license = "MIT"

[workspace.dependencies]
# Internal crates
codypendent-protocol = { path = "crates/protocol" }
codypendent-daemon = { path = "crates/daemon" }
codypendent-codypendentd = { path = "crates/codypendentd" }
codypendent-tui = { path = "crates/tui" }
codypendent-council = { path = "crates/council" }
codypendent-runtime = { path = "crates/runtime" }
codypendent-knowledge = { path = "crates/knowledge" }
codypendent-integrations = { path = "crates/integrations" }
codypendent-workflow = { path = "crates/workflow" }
codypendent-sandbox = { path = "crates/sandbox" }
codypendent-routing = { path = "crates/routing" }
codypendent-providers = { path = "crates/providers" }
codypendent-eval = { path = "crates/eval" }
codypendent-test-support = { path = "crates/test-support" }
codypendent-ui-host = { path = "crates/ui-host" }
codypendent-runner = { path = "crates/runner" }
codypendent-secrets = { path = "crates/secrets" }
codypendent-marketplace = { path = "crates/marketplace" }
codypendent-federation = { path = "crates/federation" }
codypendent-control-plane = { path = "crates/control-plane" }
codypendent-control-plane-protocol = { path = "crates/control-plane-protocol" }

# agent-framework-rs is pinned here in Phase 0 (roadmap requirement) and first
# consumed by the runtime layer in Phase 1. The runtime crate selects providers
# behind features (ADR-009: selected crates, never the umbrella `full`).
agent-framework-core = "0.2.0"
agent-framework-openai = "0.2.0"
agent-framework-anthropic = "0.2.0"

# TUI
ratatui = "0.29"
crossterm = "0.28"
unicode-segmentation = "1.12"
unicode-width = "0.2"

# Hashing (content-addressed artifact store)
sha2 = "0.10"
hex = "0.4"
# Deterministic `.cody-ui.tgz` packages are re-opened by the trusted UI host at
# launch so the extracted tree can be matched to the artifact that was signed.
flate2 = "1"
bzip2 = "0.5"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Plugin signature verification (Phase 6, STEP 6.1). `ed25519-dalek` verifies a
# publisher signature over the canonical `codypendent-plugin-signature-v1` digest
# (`sandbox::verify::signing_digest`) — a digest of the *whole manifest* (every
# field but the signature), so a signature can't be replayed against any altered
# field (capabilities, runtime command, resource caps, scopes, …); `base64`
# decodes the signature and publisher key carried as text in `plugin.toml`'s
# `[security]`. Pinned to a version that builds on the workspace's rust-version (1.82).
ed25519-dalek = "=2.2.0"
base64 = "0.22"

# GitHub & IDE integrations (Phase 3). `reqwest` is the typed GitHub client's
# HTTP transport (rustls, no system OpenSSL); `hmac` verifies webhook
# `X-Hub-Signature-256`. `wiremock` (dev) is the mock GitHub server.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
hmac = "0.12"
wiremock = "0.6"

# ACP (Agent Client Protocol) — Zed's reference Rust impl (agentclientprotocol/rust-sdk).
# Used by crates/integrations' ACP *client* (acp_client.rs) to delegate a run to
# an external agent subprocess over JSON-RPC 2.0 stdio. The only new external dep.
agent-client-protocol = "2"

# Async traits and config parsing
async-trait = "0.1"
toml = "0.8"
toml_edit = "0.22"
# Declarative workflow manifests (Phase 5, STEP 5.1) are YAML — the shape of
# `docs/specs/workflow.yaml`. Kept out of every other crate's graph: only
# `codypendent-workflow` depends on it.
serde_yaml = "0.9"

# Async runtime and serialization
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "signal", "time", "process", "fs", "sync", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Stream combinators. `StreamExt::next` drives the framework `ChatStream`
# (`ChatClient::get_streaming_response`) in the runtime's live model driver;
# pulled in only with the runtime's `provider-openai` feature.
futures = "0.3"

# Identifiers and time
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
croner = "2.1"
chrono-tz = "0.10"
url = "2"

# Errors and logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid"] }
zeroize = { version = "1.8", features = ["derive"] }

# Knowledge fabric (Phase 2): full-text (BM25), tree-sitter code graph, fs watch.
# The vector layer stays abstracted behind a trait — Phase 2 ships a small
# embedded cosine index; Qdrant is a Phase 4+ option behind the same trait.
tantivy = "0.22"
tree-sitter = "0.24"
# One grammar per language the code graph can fold. A repository whose files
# none of these cover produces an EMPTY graph, so this list is the feature's
# real reach — widen it here, and `codegraph::language_for` picks it up.
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
notify = "7"
fs4 = "0.8"

# Collaborative-document CRDT (Phase 4, ADR-016). Selected over Automerge/Yrs by
# the STEP 4.1 benchmark (`benches/crdt-bench`). The CRDT snapshot is
# authoritative for document drafts; Git stores reviewed Markdown snapshots.
loro = "1.13"

# Rich TUI output formatting (client-only, Phase 6). pulldown-cmark: the
# CommonMark + GFM-tables parser behind rustdoc/mdBook (MIT). default-features
# off drops its getopts CLI path; the pull-parser (Parser/Event/Tag) is core.
pulldown-cmark = { version = "0.13", default-features = false }

# synoptic: pure-Rust, asset-free, per-language syntax highlighter (MIT). Its
# heavy deps (regex 1.x, unicode-width) are already in the tree; it emits token
# kinds we colour ourselves onto the semantic theme.syntax.* palette.
synoptic = "2.2"

# CLI and paths
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "6"

# Test utilities
tempfile = "3"
# `process` is what makes a real `killpg(2)` reachable without `unsafe`
# (workspace lints deny it) and without shelling out to a `/bin/kill` that
# minimal images do not ship — see `codypendent_sandbox::executor`.
rustix = { version = "1", features = ["fs", "process"] }

# Unified exec PTY (adoption 09)
portable-pty = "0.9.0"
tokio-util = { version = "0.7", default-features = false }
rand = "0.8"

# File indexing and fuzzy matching (adoption 11 M2)
ignore = "0.4"
nucleo-matcher = "0.3.1"

# Architecture and testing harness (adoption 12)
vt100 = "0.15"
insta = { version = "1", features = ["redactions"] }
schemars = { version = "0.8", features = ["uuid1", "chrono"] }

# Benchmarking harness (dev-only, `[[bench]]` targets under `crates/*/benches/`).
# `default-features = false` drops `plotters` (SVG report rendering) and `rayon`
# (parallel post-run analysis): neither is needed to take a number, and both
# widen a dev-dependency graph that `cargo deny` checks with `all-features = true`.
# `cargo_bench_support` is the one feature that is NOT optional — without it
# criterion refuses to run under `cargo bench`.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# ---------------------------------------------------------------------------
# Build profiles.
#
# There was no `[profile]` section here at all until 2026-08, and `target/` had
# grown past 300 GB before a clean (as of this writing it is 48 GB, of which
# 31 GB — 65 % — is `target/debug/incremental`, which no profile setting below
# touches; that is reclaimed with `cargo sweep` or `cargo clean`, not here).
#
# These settings were chosen by measurement, and the measurement below was
# RE-RUN independently rather than inherited, because the numbers recorded here
# on the first pass overstated the wall-clock win. The corrected figures are the
# ones below; the discrepancy is called out explicitly so nobody re-derives the
# optimistic version.
#
# Benchmark: aarch64-apple-darwin, rustc 1.97.0 (2d8144b78), 18 cores, Apple
# ld-1267, CARGO_INCREMENTAL=0 (so the figures are real codegen+link, not
# rustc's query cache), each arm in its own fresh CARGO_TARGET_DIR:
#
#     cargo test -p codypendent-runner -p codypendent-sandbox \
#                --all-features --no-run
#
# 92 rlibs + 16 test binaries. The two arms are this file with the `[profile.*]`
# sections below DELETED (i.e. true cargo defaults — an env override such as
# CARGO_PROFILE_DEV_DEBUG cannot reproduce the baseline, because it does not
# reach the `package."*"` override) versus this file as it stands.
#
# Cold build, single run each:
#
#                      target/   debug/deps   .o files   wall      CPU
#     cargo defaults    631 MB     608 MB       280      9.45 s    58.97 s
#     settings below    412 MB     390 MB        64      9.42 s    50.34 s
#
#     => -35 % disk, -77 % object files, -15 % CPU, wall clock UNCHANGED.
#
# Rebuild after `touch crates/sandbox/src/lib.rs` (recompiles one member and
# relinks its test binaries) — four interleaved pairs, first discarded as
# warm-up:
#
#     cargo defaults   2.25 / 2.24 / 2.23 s wall   11.09 / 11.26 / 11.15 CPU-s
#     settings below   2.21 / 2.17 / 2.15 s wall    9.84 /  9.81 /  9.74 CPU-s
#
#     => -12 % CPU, and -3 % wall clock, which is inside the run-to-run spread.
#
# So: this is a DISK and CPU optimisation, not a latency one. An earlier version
# of this comment claimed -17 % rebuild wall clock; that does not reproduce, and
# it also contradicted the explanation in the very next paragraph — on macOS
# `split-debuginfo` already defaults to "unpacked", so DWARF stays in the .o
# files and the linker writes only an OSO reference into each test binary. There
# is no per-link debug-info copy to eliminate, so there is no link-time latency
# to win; what is saved is codegen work and bytes on disk. Keep the change for
# the 219 MB and the 15 % CPU, and do not promise anyone a faster edit loop.
#
# `split-debuginfo` is therefore NOT set explicitly below: setting it to
# "unpacked" changed nothing measurable here (it is already the default), and
# the Linux default is "off", where the per-link copy IS real but could not be
# measured from the machine this pass was run on.
#
# CI is unaffected either way: .github/workflows/ci.yml already exports
# CARGO_PROFILE_DEV_DEBUG=0 / CARGO_PROFILE_TEST_DEBUG=0, and environment
# overrides win over this file.
[profile.dev]
# Enough for a file:line in a backtrace — RUST_BACKTRACE=1 is set across CI —
# without the full DWARF type graph. This is the setting a developer actually
# notices if it is wrong, so it keeps line tables rather than going to 0.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies only. `package."*"` deliberately excludes workspace members, so
# first-party code keeps the line tables set above. Nobody steps into tantivy,
# sqlx, wasmi or loro with a debugger; this override, together with the
# build-override below, is what took `target/debug/deps` from 3.0 GB to 1.8 GB
# and the object-file count from 1290 to 239 in the table above.
debug = 0

[profile.dev.build-override]
# Build scripts and proc macros are executed, never debugged.
debug = 0

# `cargo test` compiles the harness targets under `test`, which inherits `dev`
# for everything not set here — including the `package."*"` override above,
# because dependencies are always built with `dev`.
[profile.test]
debug = "line-tables-only"

[profile.test.build-override]
debug = 0
